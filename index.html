    <script>
      // Suppress noisy third-party extension connection errors (e.g. MetaMask in sandboxed iframes)
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
        if (
          msg.indexOf('MetaMask') !== -1 ||
          msg.indexOf('metamask') !== -1 ||
          msg.indexOf('ethereum') !== -1 ||
          msg.indexOf('chrome-extension://') !== -1 ||
          msg.indexOf('Failed to connect to MetaMask') !== -1
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          console.warn('[Extension Notice] Suppressed browser extension rejection:', msg);
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event.message || '') + '';
        var filename = (event.filename || '') + '';
        if (
          msg.indexOf('MetaMask') !== -1 ||
          msg.indexOf('metamask') !== -1 ||
          msg.indexOf('ethereum') !== -1 ||
          filename.indexOf('chrome-extension://') !== -1 ||
          msg.indexOf('Failed to connect to MetaMask') !== -1
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          console.warn('[Extension Notice] Suppressed browser extension error:', msg);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
